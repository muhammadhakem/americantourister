const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function setUpdatedTime() {
  const now = new Date();
  $('updated-time').textContent =
    now.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) + ', ' +
    now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

/* ---- At-a-glance strip ---------------------------------- */
function renderGlance(platformKey) {
  const g = DATA.ui.glance;
  const cards = platformKey === 'tiktok'
    ? [g.storeVc, g.bundle, g.shipping]
    : [g.hero, g.bundle, g.storeVc, g.shipping];

  $('glance').className = platformKey === 'tiktok'
    ? 'grid grid-cols-1 sm:grid-cols-3 gap-3'
    : 'grid grid-cols-2 lg:grid-cols-4 gap-3';

  $('glance').innerHTML = cards.map(c => `
    <div class="bg-white rounded-2xl border border-slate-200 shadow-card p-4 flex flex-col gap-1">
      <div class="flex items-center gap-2 text-[10px] font-bold uppercase tracking-wider text-slate-500">
        <i class="fa-solid ${c.icon} text-${c.colour}-500"></i><span>${esc(c.label)}</span>
      </div>
      <div class="text-sm sm:text-base font-black text-slate-900 leading-tight">${esc(c.value)}</div>
      <div class="text-[11px] font-semibold text-slate-500">${esc(c.sub)}</div>
    </div>
  `).join('');
}

      <article class="relative overflow-hidden bg-gradient-to-r from-pink-50 via-white to-rose-50 rounded-3xl border-2 border-pink-300 p-5 sm:p-6 shadow-card">

  $('top-offers').innerHTML = exclusiveCards + bundleCard;

/* ============================================================
   PLATFORM SWITCH
   ============================================================ */
const TAB_BASE = 'flex-1 md:flex-none flex items-center justify-center gap-2 px-5 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all';
const TAB_ACTIVE   = `${TAB_BASE} text-white shadow-md`;
const TAB_INACTIVE = `${TAB_BASE} text-slate-600 hover:text-slate-900`;

function switchPlatform(key) {
  const p = DATA.platforms[key];

  $('tab-shopee').className = key === 'shopee' ? `${TAB_ACTIVE} bg-at-shopee` : TAB_INACTIVE;
  $('tab-tiktok').className = key === 'tiktok' ? `${TAB_ACTIVE} bg-black`       : TAB_INACTIVE;

  const pill = $('platform-pill');
  pill.textContent = `Viewing: ${p.name}`;
  pill.className = `px-3 py-1 text-[10px] sm:text-xs font-bold rounded-full shadow-sm ${
    key === 'shopee' ? 'bg-at-shopee text-white' : 'bg-black text-white'
  }`;

  renderGlance(key);
  renderTopOffers(key);
  renderVouchers(p);
  renderScripts(key);
}

/* ============================================================
   COPY TO CLIPBOARD (event delegation)
   ============================================================ */
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.copy-btn');
  if (!btn) return;

  const text = decodeURIComponent(btn.dataset.copy);
  navigator.clipboard?.writeText(text).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  });

  const original = btn.innerHTML;
  btn.innerHTML = `<i class="fa-solid fa-check"></i><span>${esc(DATA.ui.scripts.copiedButton)}</span>`;
  btn.classList.add('bg-emerald-600');
  setTimeout(() => {
    btn.innerHTML = original;
    btn.classList.remove('bg-emerald-600');
  }, 1600);
});

document.addEventListener('DOMContentLoaded', () => {
  setUpdatedTime();

});
